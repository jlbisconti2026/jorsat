instanceID: "claro-apigeeh-desa-inst"
namespace: "claro-apigeeh-desa"

gcp:
  projectID: "claup-apigee-hybrid-desa"
  region: us-central1

k8sCluster:
  name: oseinfrait01.claro.amx
  region: us-central1

# Configuración global
nodeSelector:
  requiredForScheduling: true
  apigeeRuntime:
    key: "node-role.kubernetes.io/apigee-runtime"
    value: ""
  apigeeData:
    key: "node-role.kubernetes.io/apigee-data"
    value: ""

org: "claup-apigee-hybrid-desa"
enhanceProxyLimits: true
#contractProvider: https://us-apigee.googleapis.com

# Declaración de los entornos lógicos
envs:
- name: desa-ar
  synchronizerEnabled: true
  serviceAccountSecretRefs:
    synchronizer: "apigee-non-prod"
    runtime: "apigee-non-prod"
#  components:
#    runtime:
#      jvm:
#        maxMemory: "4Gi"
#      replicaCountMin: 3
#      replicaCountMax: 3
#    synchronizer:
#      replicaCountMin: 3
#      replicaCountMax: 3

- name: desa-uy
  synchronizerEnabled: true
  analytics:
   region: us-central1
  serviceAccountSecretRefs:
    synchronizer: "apigee-non-prod"
    runtime: "apigee-non-prod"

- name: desa-py
  synchronizerEnabled: true
  analytics:
   region: us-central1
  serviceAccountSecretRefs:
    synchronizer: "apigee-non-prod"
    runtime: "apigee-non-prod"

- name: test-ar
  synchronizerEnabled: true
  analytics:
   region: us-central1
  serviceAccountSecretRefs:
    synchronizer: "apigee-non-prod"
    runtime: "apigee-non-prod"

- name: test-uy
  synchronizerEnabled: true
  analytics:
   region: us-central1
  serviceAccountSecretRefs:
    synchronizer: "apigee-non-prod"
    runtime: "apigee-non-prod"

- name: test-py
  synchronizerEnabled: true
  analytics:
   region: us-central1
  serviceAccountSecretRefs:
    synchronizer: "apigee-non-prod"
    runtime: "apigee-non-prod"

cassandra:
  hostNetwork: false
  replicaCount: 3
  storage:
    storageClass: thin-csi
    storageSize: 250Gi
#  nodeSelector:
#    node-role.kubernetes.io/apigee-data: ""
  schemaValidationEnabled: true
  auth:
    ddl:
      password: Tiloveapis123

#Ingress Manager
#ao:
#  image:
#    tag: "1.16.9"

ingressGateways:
- name: apigee-ingress
  svcType: ClusterIP
  replicaCountMin: 3
  replicaCountMax: 3
- name: internal-chaining
  replicaCountMin: 3
  replicaCountMax: 3

virtualhosts:
- name: claro-desa-test-ar-group
  selector:
    app: apigee-ingressgateway
    ingress_name: apigee-ingress
  tlsMode: SIMPLE
  #sslCertPath: certs/apps-oseinfrait01-claro-amx.crt
  #sslKeyPath: certs/apps-oseinfrait01-claro-amx.key
  sslCertPath: certs/claro.com.ar.crt
  sslKeyPath: certs/claro.com.ar.key
  requestTimeout: 300
  connectTimeout: null
  hostAliases:
    - "*.claro.com.ar"
    - "apigee-desa-test-ar.apps.oseinfrait01.claro.amx"
    - "apigee-desa-test.claro.com.ar"

- name: claro-desa-test-uy-group
  selector:
    app: apigee-ingressgateway
    ingress_name: apigee-ingress
  tlsMode: SIMPLE
  #sslCertPath: certs/apps-oseinfrait01-claro-amx.crt
  #sslKeyPath: certs/apps-oseinfrait01-claro-amx.key
  sslCertPath: certs/claro.com.ar.crt
  sslKeyPath: certs/claro.com.ar.key
  requestTimeout: 300
  connectTimeout: null
  hostAliases:
    - "*.claro.com.uy"
    - "apigee-desa-test-uy.apps.oseinfrait01.claro.amx"
    - "apigee-desa-test.claro.com.uy"

- name: claro-desa-test-py-group
  selector:
    app: apigee-ingressgateway
    ingress_name: apigee-ingress
  tlsMode: SIMPLE
  #sslCertPath: certs/apps-oseinfrait01-claro-amx.crt
  #sslKeyPath: certs/apps-oseinfrait01-claro-amx.key
  sslCertPath: certs/claro.com.ar.crt
  sslKeyPath: certs/claro.com.ar.key
  requestTimeout: 300
  connectTimeout: null
  hostAliases:
    - "*.claro.com.py"
    - "apigee-desa-test-py.apps.oseinfrait01.claro.amx"
    - "apigee-desa-test.claro.com.py"

# Componentes globales usando apigee-non-prod
guardrails:
  serviceAccountRef: "apigee-non-prod"

mart:
  serviceAccountRef: "apigee-non-prod"
  replicaCountMin: 1
  replicaCountMax: 1

connectAgent:
  serviceAccountRef: "apigee-non-prod"
  replicaCountMin: 1
  replicaCountMax: 1

logger:
  enabled: true
  serviceAccountRef: "apigee-non-prod"

# Colector de analíticas UDCA
udca:
  serviceAccountRef: "apigee-non-prod"
  replicaCountMin: 1
  replicaCountMax: 1

# Métricas y ServiceMonitor automático para Prometheus Operator
metrics:
  enabled: true
  serviceAccountRef: "apigee-non-prod"
  app:
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true

watcher:
  serviceAccountRef: "apigee-non-prod"
  replicaCountMin: 1
  replicaCountMax: 1

mintTaskScheduler:
  serviceAccountRef: "apigee-non-prod"

# Deshabilitar autoescalado por métricas a nivel global
customAutoscaling:
  enabled: false

runtime:
  replicaCountMin: 1
  replicaCountMax: 1
  cwcAppend:
    bin_setenv_max_mem: 4096M
  resources:
    requests:
      memory: 4096M
    limits:
      memory: 6092M

synchronizer:
  replicaCountMin: 1
  replicaCountMax: 1
