  bucket:
    name: "n8n-ia-noprod"
    region: "BSAS-ARGENTINA-1"
  host: "http://10.202.36.116"
  auth:
    autoDetect: false
    accessKeyId: "BDCC0CE302462F054D96"
    secretAccessKey: "9mpxT08V4+Rmx7CjG449uBlklvQAAAGaAkYvBg62"
