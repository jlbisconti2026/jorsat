apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-prueba
  namespace: microservicios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mi-apache
  template:
    metadata:
      labels:
        app: mi-apache
    spec:
      containers:
      - name: apache
        image: httpd:alpine # La versión de Alpine pesa nada y levanta al toque
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: apache-service
  namespace: microservicios
spec:
  type: LoadBalancer # Para que MetalLB le asigne una IP de tu red local
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: mi-apache